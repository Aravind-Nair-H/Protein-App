<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <input id="input" type="text">
  <button onclick="getPokemon()">Add Food</button>
  <img id="pokemonImage" src="">
<p id="result"></p>

<script>
  async function getPokemon() {
   let name = document.getElementById("input").value.toLowerCase();  
  try{
    const response = await fetch(
    `https://world.openfoodfacts.org/api/v2/search?search_terms=${encodeURIComponent(name)}` );

    if(!response.ok){
    alert("invalid input");console.log(response.status);
    return;
  } 
   
  const data = await response.json(); console.log(data);

  for(i=0;i<data.products.length;i++){
    if(data.products[i].product_name &&
  data.products[i].product_name.toLowerCase().includes(name)){
      break;
    }
    if (data.products.length === 0) {
      alert("Food not found");return;
}
  }
  document.getElementById("result").textContent = 
   `food:${data.products[i].product_name} 
   protein per100g :${data.products[i].nutriments.proteins_100g}`;

  // document.getElementById("pokemonImage").src = data.sprites.front_default;
  }
  catch(error){
    console.error(error);
    alert("something went wrong");
  }
   
  
   
}
</script>
</body>
</html>
