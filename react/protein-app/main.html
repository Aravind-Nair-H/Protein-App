<!DOCTYPE html>
<html>

<head>  
  <link rel="stylesheet" href="main.css">
</head>

<body>
  <div id="pbar">
    <p>Protein intaken :</p>
    <p id="pcounter"></p>
    <div id="progress-container">
      <div id="progress-fill"></div> 
    </div> 
     <p id="progress-fill-writing"></p>
    <button id="p-reset" onclick="resetP()">Reset Protein</button>
  </div>
  <input type="text" id="p-food-input"><input type="number" id="p-food-input-amount" max="50" min="1">
  <button id="p-add-button" onclick="addp()">ADD</button>
  <div id="foodlist-container"></div>

  <script>
    let foodList = [];
    let foodQ = parseFloat(getElementById("p-food-input-amount").value);
    let savedp = localStorage.getItem("protein");
    let pcountNumerator = savedp ? parseFloat(savedp) : 0;
    let pcounterDenominator = 130;

    function updateDisplay() {
      document.getElementById("pcounter").innerText = pcountNumerator.toFixed(2) + "/" + pcounterDenominator + "g";
      let percentage = (pcountNumerator / pcounterDenominator) * 100;
      if (percentage > 100) { percentage = 100; }
      document.getElementById("progress-fill").style.width = percentage + "%";
      document.getElementById("progress-fill-writing").innerHTML = percentage.toFixed(1) + "%";
    }
    updateDisplay();

    let foodDatabase = {
      banana: 1.30,
      egg: 6.00,
      chicken: 24.00,
      milk: 3.40
    };

    function resetP() {
      document.getElementById("p-food-input").value = "";
      localStorage.removeItem("protein");
      pcountNumerator = 0;
      updateDisplay();
      document.getElementById("foodlist-container").innerHTML ="";
    }

    function addp() {
      let food = document.getElementById("p-food-input").value.trim().toLowerCase();
      if (food in foodDatabase) {
        let pValue = foodDatabase[food];
        let foodItem = { name: food, protein: pValue ,count: foodQ };
        foodList.push(foodItem);
        pcountNumerator += foodDatabase[food];
        localStorage.setItem("protein", pcountNumerator);
      }
      else {
        alert("food not found in database");
        return;
      }
      updateDisplay();
      document.getElementById("p-food-input").value = "";
      document.getElementById("p-food-input-amount").value = "";
      renderFoodlist();
    }

    function renderFoodlist(){
      let container = document.getElementById("foodlist-container");
      container.innerHTML = "";
      for(let i = 0; i < foodList.length; i++ ){
        let item = foodList[i];
        let div =document.createElement("div");
        div.innerText = item.name + " - " + item.protein + "g" ;
        container.appendChild(div); 
      }
    }
    
  </script>
</body>

</html>
